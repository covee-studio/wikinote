<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>New Tab - Wikinote</title>

    <style>
      /* Match the default Waves surface before React mounts. Keeping the
         bootstrap paint opaque prevents Chrome's white canvas from flashing
         through during new-tab startup. */
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #f8f7f4;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      #root {
        overflow: hidden auto;
      }
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading" aria-label="Loading Wikinote"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
