name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bump version (PR → beta)
        if: github.event_name == 'pull_request'
        run: node scripts/beta-bump.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Build extension
        run: npm run build:extension

      - name: Pack extension
        run: npm run pack:extension

      - name: Read version and changelog entry
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Extract the first ## section from CHANGELOG.md as release notes
          NOTES=$(awk '/^## /{found++} found==1{print} found==2{exit}' CHANGELOG.md)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Rename artifact with version
        run: mv dist/wikinote-extension.zip dist/wikinote-extension-v${{ steps.version.outputs.version }}.zip

      - name: Create release (push to main)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.version.outputs.notes }}
          files: frontend/dist/wikinote-extension-v${{ steps.version.outputs.version }}.zip
          prerelease: false

      - name: Create release (PR → beta)
        if: github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Beta build from PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}

            Branch: `${{ github.head_ref }}`
          files: frontend/dist/wikinote-extension-v${{ steps.version.outputs.version }}.zip
          prerelease: true
