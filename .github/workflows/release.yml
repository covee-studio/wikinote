name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test behavior
        run: npm test

      - name: Build web
        run: npm run build:web

      - name: Build extension
        run: npm run build:extension

      - name: Pack extension
        run: npm run pack:extension

      - name: Verify regressions and package
        run: npm run verify:regressions

      - name: Read version and changelog entry
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Extract the first ## section from CHANGELOG.md as release notes
          NOTES=$(awk '/^## /{found++} found==1{print} found==2{exit}' CHANGELOG.md)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./configs/extension/manifest.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
          test "$TAG_VERSION" = "$MANIFEST_VERSION"
          test "$TAG_VERSION" = "$LOCK_VERSION"

      - name: Rename artifact with version
        run: mv dist/wikinote-extension.zip dist/wikinote-extension-v${{ steps.version.outputs.version }}.zip

      - name: Upload verified build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: wikinote-extension-v${{ steps.version.outputs.version }}
          path: frontend/dist/wikinote-extension-v${{ steps.version.outputs.version }}.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.version.outputs.notes }}
          files: frontend/dist/wikinote-extension-v${{ steps.version.outputs.version }}.zip
          prerelease: false
